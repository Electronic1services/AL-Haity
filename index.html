<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>خريطة عدادات الحائط</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-950:#0a2e2e;
    --teal-900:#0f3d3d;
    --teal-700:#155e5e;
    --teal-500:#1d8a8a;
    --amber-500:#d97b1f;
    --amber-100:#fce9d2;
    --sand-50:#f6f4ef;
    --ink:#1c2624;
    --line:#e2e0d8;
    --on-color:#1d8a4a;
    --off-color:#c23b3b;
    --shadow: 0 8px 28px rgba(10,46,46,.18);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    font-family:'Tajawal',sans-serif;
    background:var(--sand-50);
    color:var(--ink);
    overscroll-behavior:none;
  }
  #app{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
  }

  /* ---- Top bar ---- */
  #topbar{
    background:var(--teal-950);
    color:#fff;
    padding:10px 12px;
    display:flex; flex-direction:column; gap:8px;
    z-index:1200;
    box-shadow:var(--shadow);
  }
  #topbar .row1{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  #topbar h1{
    font-size:16px; font-weight:900; margin:0;
    display:flex; align-items:center; gap:6px;
  }
  #topbar h1 .count{
    font-weight:500; font-size:12px; color:#bfe3e3;
  }
  #empName{
    background:var(--teal-900);
    border:1px solid var(--teal-700);
    color:#fff;
    border-radius:10px;
    padding:8px 10px;
    font-family:'Tajawal',sans-serif;
    font-size:13px;
    width:130px;
    text-align:right;
  }
  #empName::placeholder{color:#8fbcbc;}
  #searchRow{
    display:flex; gap:8px;
  }
  #searchBox{
    flex:1;
    padding:10px 12px;
    border-radius:12px;
    border:none;
    font-family:'Tajawal',sans-serif;
    font-size:14px;
    background:#fff;
    color:var(--ink);
  }
  #searchBox:focus{outline:2px solid var(--amber-500);}
  #filterBtn{
    background:var(--teal-700);
    border:1px solid var(--teal-500);
    color:#fff;
    border-radius:12px;
    padding:0 14px;
    font-size:13px;
    font-family:'Tajawal',sans-serif;
    white-space:nowrap;
  }
  #filterBtn.active{background:var(--amber-500); border-color:var(--amber-500);}

  #searchResults{
    position:absolute; top:96px; right:12px; left:12px;
    background:#fff; border-radius:12px; box-shadow:var(--shadow);
    max-height:45vh; overflow:auto; z-index:1300; display:none;
  }
  #searchResults .item{
    padding:10px 12px; border-bottom:1px solid var(--line);
    font-size:13px; cursor:pointer;
  }
  #searchResults .item:active{background:var(--amber-100);}
  #searchResults .item b{color:var(--teal-900);}
  #searchResults .item .sub{color:#767; color:#6b7370; font-size:12px; margin-top:2px;}
  #searchResults .empty{padding:14px; text-align:center; color:#888; font-size:13px;}

  /* ---- Map ---- */
  #map{position:absolute; inset:0; width:100%; height:100%; min-height:300px; background:#d9d9d9;}
  .leaflet-control-attribution{font-size:9px;}

  /* Safety-net Leaflet core styles: if the external leaflet.css is slow to load or briefly
     blocked on some networks, these essential rules keep the map itself sized, clipped, and
     interactive (tiles positioned correctly, controls tappable) until the full stylesheet arrives. */
  .leaflet-container{ position:relative; overflow:hidden; -webkit-tap-highlight-color:transparent; background:#ddd; outline:0; touch-action:pan-x pan-y; }
  .leaflet-container a{ color:#0078A8; }
  .leaflet-pane{ z-index:400; }
  .leaflet-tile-pane{ z-index:200; }
  .leaflet-overlay-pane{ z-index:400; }
  .leaflet-marker-pane{ z-index:600; }
  .leaflet-popup-pane{ z-index:700; }
  .leaflet-map-pane canvas{ z-index:100; }
  .leaflet-map-pane svg{ z-index:200; }
  .leaflet-tile-pane, .leaflet-map-pane, .leaflet-marker-pane, .leaflet-overlay-pane, .leaflet-popup-pane, .leaflet-shadow-pane{ position:absolute; left:0; top:0; }
  .leaflet-tile{ position:absolute; width:256px; height:256px; user-select:none; -webkit-user-drag:none; }
  .leaflet-control-container .leaflet-top, .leaflet-control-container .leaflet-bottom{ position:absolute; z-index:1000; pointer-events:none; }
  .leaflet-top{ top:0; } .leaflet-right{ right:0; } .leaflet-bottom{ bottom:0; } .leaflet-left{ left:0; }
  .leaflet-control{ pointer-events:auto; float:left; clear:both; margin:10px; }
  .leaflet-bar{ background:#fff; border-radius:6px; box-shadow:0 1px 5px rgba(0,0,0,.4); }
  .leaflet-bar a{ display:block; width:30px; height:30px; line-height:30px; text-align:center; text-decoration:none; color:#333; font-size:18px; }
  .leaflet-marker-icon, .leaflet-marker-shadow{ position:absolute; }

  .meter-pin{
    width:26px; height:26px; border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    box-shadow:0 2px 6px rgba(0,0,0,.35);
    border:2px solid #fff;
    display:flex; align-items:center; justify-content:center;
  }
  .meter-pin.on{background:var(--on-color);}
  .meter-pin.off{background:var(--off-color);}
  .meter-pin .dot{
    width:8px; height:8px; border-radius:50%;
    background:#fff; transform:rotate(45deg);
  }
  .marker-cluster-custom{
    background:var(--teal-900); color:#fff; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Tajawal',sans-serif; font-weight:700; font-size:13px;
    border:3px solid rgba(255,255,255,.85);
    box-shadow:0 2px 8px rgba(0,0,0,.3);
  }

  /* ---- Legend ---- */
  #legend{
    position:absolute; bottom:16px; left:10px; z-index:900;
    background:rgba(255,255,255,.95); border-radius:10px;
    padding:8px 10px; font-size:12px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:4px;
  }
  #legend .l{display:flex; align-items:center; gap:6px;}
  #legend .sw{width:10px; height:10px; border-radius:50%;}

  #locateBtn{
    position:absolute; bottom:16px; right:10px; z-index:900;
    width:44px; height:44px; border-radius:50%;
    background:#fff; box-shadow:var(--shadow); border:none;
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
  }

  /* Custom zoom buttons: styled entirely with our own CSS (not dependent on
     leaflet.css loading), so they are guaranteed to show up and be tappable
     regardless of any external stylesheet delay or block. */
  #zoomControls{
    position:absolute; bottom:70px; right:10px; z-index:900;
    display:flex; flex-direction:column; box-shadow:var(--shadow);
    border-radius:12px; overflow:hidden;
  }
  #zoomControls button{
    width:44px; height:44px; background:#fff; border:none;
    font-size:22px; font-weight:700; color:var(--teal-950);
    display:flex; align-items:center; justify-content:center;
  }
  #zoomControls button:first-child{ border-bottom:1px solid var(--line); }
  #zoomControls button:active{ background:var(--sand-50); }

  /* ---- Bottom sheet ---- */
  #overlay{
    position:fixed; inset:0; background:rgba(10,20,20,.45);
    z-index:1400; display:none;
  }
  #sheet{
    position:fixed; right:0; left:0; bottom:0; z-index:1500;
    background:#fff; border-radius:18px 18px 0 0;
    box-shadow:0 -8px 30px rgba(0,0,0,.3);
    max-height:88vh; overflow:auto;
    transform:translateY(100%);
    transition:transform .25s ease;
    padding-bottom:24px;
  }
  #sheet.open{transform:translateY(0);}
  #sheetHandle{
    display:flex; justify-content:center; padding:10px 0 4px;
  }
  #sheetHandle span{width:40px; height:4px; border-radius:3px; background:var(--line);}

  #sheetHeader{
    padding:4px 18px 12px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  }
  #sheetHeader .status-badge{
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px;
    color:#fff; white-space:nowrap;
  }
  .status-badge.on{background:var(--on-color);}
  .status-badge.off{background:var(--off-color);}
  #sheetHeader h2{margin:0 0 4px; font-size:17px; color:var(--teal-950);}
  #sheetHeader .meterid{font-size:13px; color:#666;}

  .infoGrid{
    display:grid; grid-template-columns:1fr 1fr; gap:8px;
    padding:12px 18px; border-bottom:1px solid var(--line);
  }
  .infoGrid .cell{
    background:var(--sand-50); border-radius:10px; padding:8px 10px;
  }
  .infoGrid .cell .label{font-size:11px; color:#8a8f8c;}
  .infoGrid .cell .val{font-size:14px; font-weight:700; color:var(--ink); margin-top:2px;}

  #gmapBtn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin:14px 18px 6px;
    background:var(--teal-950); color:#fff; text-decoration:none;
    padding:13px; border-radius:12px; font-weight:700; font-size:14px;
  }
  #gmapBtn:active{background:var(--teal-700);}

  #sheetBody{padding:14px 18px;}
  #sheetBody h3{font-size:14px; margin:0 0 8px; color:var(--teal-900);}

  #noteText{
    width:100%; min-height:80px; border-radius:12px;
    border:1.5px solid var(--line); padding:10px 12px;
    font-family:'Tajawal',sans-serif; font-size:14px; resize:vertical;
  }
  #noteText:focus{outline:none; border-color:var(--amber-500);}

  #photoRow{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .photoLabel{
    display:flex; align-items:center; gap:6px;
    background:var(--sand-50); border:1.5px dashed var(--line);
    border-radius:12px; padding:10px 14px; font-size:13px; cursor:pointer;
    color:var(--teal-900);
  }
  #photoPreviewWrap{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
  #photoPreviewWrap img{width:64px; height:64px; object-fit:cover; border-radius:10px; border:1px solid var(--line);}
  .photoDel{
    position:relative;
  }
  .photoDel .x{
    position:absolute; top:-6px; left:-6px; background:var(--off-color); color:#fff;
    width:20px; height:20px; border-radius:50%; font-size:12px; display:flex; align-items:center; justify-content:center;
  }

  #saveBtn{
    width:100%; margin-top:14px; padding:13px; border:none; border-radius:12px;
    background:var(--amber-500); color:#fff; font-weight:900; font-size:15px;
    font-family:'Tajawal',sans-serif;
  }
  #saveBtn:active{background:#b5670f;}
  #saveMsg{
    text-align:center; font-size:12px; color:var(--on-color); margin-top:6px; min-height:14px;
  }

  #notesLog{margin-top:18px;}
  .noteEntry{
    background:var(--sand-50); border-radius:12px; padding:10px 12px; margin-bottom:8px;
    border-right:3px solid var(--teal-500);
  }
  .noteEntry .meta{display:flex; justify-content:space-between; font-size:11px; color:#828a86; margin-bottom:4px;}
  .noteEntry .meta b{color:var(--teal-900);}
  .noteEntry .txt{font-size:13.5px; line-height:1.6;}
  .noteEntry .imgs{display:flex; gap:6px; margin-top:6px;}
  .noteEntry .imgs img{width:56px; height:56px; object-fit:cover; border-radius:8px;}
  .noEntries{color:#999; font-size:13px; text-align:center; padding:10px;}

  #closeSheet{
    position:absolute; top:10px; left:14px; background:var(--sand-50);
    border:none; border-radius:50%; width:32px; height:32px; font-size:16px; color:#666;
  }

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:#ccc; border-radius:3px;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="row1">
      <h1>📍 خريطة عدادات الحائط <span class="count" id="totalCount"></span></h1>
      <input id="empName" placeholder="اسم الموظف" />
    </div>
    <div id="searchRow">
      <input id="searchBox" placeholder="ابحث برقم العداد / رقم الحساب / اسم المشترك / الموقع" />
      <button id="filterBtn">الكل</button>
    </div>
    <div id="searchResults"></div>
  </div>

  <div style="position:relative; flex:1;">
    <div id="map"></div>
    <div id="legend">
      <div class="l"><span class="sw" style="background:var(--on-color)"></span> محدث</div>
      <div class="l"><span class="sw" style="background:var(--off-color)"></span> غير محدث</div>
    </div>
    <div id="zoomControls">
      <button id="zoomInBtn" title="تكبير">+</button>
      <button id="zoomOutBtn" title="تصغير">−</button>
    </div>
    <button id="locateBtn" title="موقعي">🎯</button>
  </div>
</div>

<div id="overlay"></div>
<div id="sheet">
  <div id="sheetHandle"><span></span></div>
  <button id="closeSheet">✕</button>
  <div id="sheetHeader">
    <div>
      <h2 id="shName"></h2>
      <div class="meterid" id="shMeter"></div>
    </div>
    <div class="status-badge" id="shStatus"></div>
  </div>

  <div class="infoGrid">
    <div class="cell"><div class="label">رقم الحساب</div><div class="val" id="shAccount"></div></div>
    <div class="cell"><div class="label">الفرع</div><div class="val" id="shBranch"></div></div>
    <div class="cell" style="grid-column:1/-1;"><div class="label">الموقع</div><div class="val" id="shPlace"></div></div>
  </div>

  <a id="gmapBtn" href="#" target="_blank" rel="noopener">🧭 افتح الموقع في خرائط قوقل</a>

  <div id="sheetBody">
    <h3>✏️ تسجيل ملاحظة</h3>
    <textarea id="noteText" placeholder="اكتب ملاحظتك عن هذا العداد..."></textarea>

    <div id="photoRow">
      <label class="photoLabel" for="photoInput">📷 تصوير / إرفاق صورة
        <input type="file" id="photoInput" accept="image/*" capture="environment" multiple style="display:none">
      </label>
    </div>
    <div id="photoPreviewWrap"></div>

    <button id="saveBtn">💾 حفظ الملاحظة</button>
    <div id="saveMsg"></div>

    <div id="notesLog">
      <h3>🕐 سجل الملاحظات السابقة</h3>
      <div id="notesLogList"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

/* ============ STORAGE (Firestore + local fallback) ============ */
const EMP_KEY = 'meters_emp_name';
const PENDING_KEY = 'meters_notes_pending'; // notes saved locally while offline, not yet synced

// live in-memory index built from Firestore real-time snapshot: { meterId: [entry, entry, ...] }
let notesIndex = {};
let firestoreReady = false;

function getNotesFor(meterId){
  return notesIndex[meterId] || [];
}

function loadPending(){
  try{ return JSON.parse(localStorage.getItem(PENDING_KEY) || '{}'); }catch(e){ return {}; }
}
function savePendingEntry(meterId, entry){
  const all = loadPending();
  if(!all[meterId]) all[meterId] = [];
  all[meterId].unshift(entry);
  localStorage.setItem(PENDING_KEY, JSON.stringify(all));
}

// merge any locally-pending (offline) notes into the live index so nothing is lost from view
function mergePendingIntoIndex(){
  const pending = loadPending();
  Object.keys(pending).forEach(meterId => {
    if(!notesIndex[meterId]) notesIndex[meterId] = [];
    pending[meterId].forEach(p => notesIndex[meterId].unshift(p));
  });
}

// real-time listener: reflects every employee's notes on every device instantly
notesCollection.orderBy('createdAt', 'desc').onSnapshot(snapshot => {
  const fresh = {};
  snapshot.forEach(doc => {
    const d = doc.data();
    if(!fresh[d.meterId]) fresh[d.meterId] = [];
    fresh[d.meterId].push({
      employee: d.employee,
      text: d.text,
      photos: d.photos || [],
      time: d.time
    });
  });
  notesIndex = fresh;
  mergePendingIntoIndex();
  firestoreReady = true;
  // if a meter's sheet is currently open, refresh its log live
  if(currentMeter) renderNotesLog(currentMeter.meter);
}, err => {
  console.error('Firestore listener error:', err);
  mergePendingIntoIndex();
});

async function addNoteFor(meterId, entry){
  try{
    await notesCollection.add({
      meterId: meterId,
      employee: entry.employee,
      text: entry.text,
      photos: entry.photos,
      time: entry.time,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return true; // synced successfully, everyone will see it live
  }catch(e){
    console.error('Failed to sync note, saving locally:', e);
    savePendingEntry(meterId, entry);
    if(!notesIndex[meterId]) notesIndex[meterId] = [];
    notesIndex[meterId].unshift(entry);
    return false; // saved locally only, will not show for other employees
  }
}

const map = L.map(mapEl, {
  zoomControl:false,
  attributionControl:true,
  dragging:true,
  touchZoom:true,
  scrollWheelZoom:true,
  doubleClickZoom:true,

}).setView([26.15,40.6], 10);

// خريطة عادية احتياطية موثوقة.
const standardLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  subdomains:'abc', maxZoom:19, crossOrigin:true,
  attribution:'&copy; OpenStreetMap contributors'
});

// صور أقمار صناعية Esri World Imagery.
const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom:19, crossOrigin:true, updateWhenIdle:false, keepBuffer:4,
  attribution:'Tiles &copy; Esri'
});

// نبدأ بالقمر الصناعي مباشرة.
satelliteLayer.addTo(map);
let isSatelliteView = true;
let satelliteErrors = 0;

// إذا تعذر تحميل بلاطات Esri على شبكة المستخدم، لا نترك الشاشة بيضاء؛ نعرض العادي تلقائياً.
satelliteLayer.on('tileerror', function(){
  satelliteErrors++;
  if (satelliteErrors >= 8 && isSatelliteView) {
    if (map.hasLayer(satelliteLayer)) map.removeLayer(satelliteLayer);
    if (!map.hasLayer(standardLayer)) standardLayer.addTo(map);
    isSatelliteView = false;
    mapTypeBtn.textContent = '🛰️ قمر صناعي';
    mapStatus.textContent = 'تعذر تحميل صور الأقمار من الشبكة — تم تشغيل الخريطة العادية';
    mapStatus.style.display = 'block';
  }
});

// مهم جداً مع flex وSafari: إعادة حساب مساحة الخريطة بعد ظهور الصفحة.

function pinIcon(status){
  const cls = status === 'محدث' ? 'on' : 'off';
  return L.divIcon({
    className:'',
    html:`<div class="meter-pin ${cls}"><div class="dot"></div></div>`,
    iconSize:[26,26],
    iconAnchor:[13,26],
    popupAnchor:[0,-24]
  });
}

// عرض كل عداد كعلامة مستقلة بدون دمج أو فقاعات أرقام.
// L.layerGroup يحافظ على وظائف الفلترة والإضافة/الحذف الموجودة في الصفحة.
const markersLayer = L.layerGroup();
const markersByMeter = {};
const bounds = [];

METERS.forEach(m => {
  const marker = L.marker([m.lat, m.lng], { icon: pinIcon(m.status) });
  marker.meterData = m;
  marker.on('click', () => openSheet(m));
  markersLayer.addLayer(marker);
  markersByMeter[m.meter] = marker;
  bounds.push([m.lat, m.lng]);
});
map.addLayer(markersLayer);
if(bounds.length) map.fitBounds(bounds, { padding:[30,30] });

/* Fix for blank/white map on mobile: Leaflet sometimes measures its container
   before the page has finished laying out (especially inside flex containers
   or right after the page loads on a phone). Forcing a resize check a moment
   after load, and again on orientation/resize changes, makes the tiles and
   drag/pan behavior render correctly. */
function refreshMapSize(){
  map.invalidateSize();
  if(bounds.length) map.fitBounds(bounds, { padding:[30,30] });
}
window.addEventListener('load', () => setTimeout(refreshMapSize, 300));
setTimeout(refreshMapSize, 800);
setTimeout(refreshMapSize, 1500);
setTimeout(refreshMapSize, 3000);
window.addEventListener('resize', () => map.invalidateSize());
window.addEventListener('orientationchange', () => setTimeout(() => map.invalidateSize(), 300));

// Most robust fix: watch the map container itself and re-check its size the instant
// it actually changes, instead of guessing fixed delays. This catches slow CDN loads,
// slow layout on older phones, or the address bar hiding/showing on mobile Safari.
if(window.ResizeObserver){
  const mapContainerEl = document.getElementById('map');
  const ro = new ResizeObserver(() => {
    map.invalidateSize();
  });
  ro.observe(mapContainerEl);
}

/* filter ON/OFF/ALL */

  const btn = document.getElementById('filterBtn');
  markersLayer.clearLayers();
  Object.values(markersByMeter).forEach(mk => {
    if(currentFilter === 'ALL' || mk.meterData.status === currentFilter){
      markersLayer.addLayer(mk);
    }
  });
  if(currentFilter === 'ALL'){ btn.textContent = 'الكل'; btn.classList.remove('active'); }
  else { btn.textContent = currentFilter === 'محدث' ? 'محدث فقط' : 'غير محدث فقط'; btn.classList.add('active'); }

searchBox.addEventListener('input', () => {

  if(!q){ resultsBox.style.display='none'; resultsBox.innerHTML=''; return; }

    norm(m.meter).includes(q) ||
    norm(m.account).includes(q) ||
    norm(m.name).includes(q) ||
    norm(m.place).includes(q)
  ).slice(0, 30);

  resultsBox.innerHTML = '';
  if(found.length === 0){
    resultsBox.innerHTML = '<div class="empty">لا توجد نتائج</div>';
  } else {
    found.forEach(m => {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `<b>عداد ${m.meter}</b> — ${m.name}<div class="sub">${m.place || m.branch} · حساب ${m.account} · ${m.status === 'محدث' ? '🟢 محدث' : '🔴 غير محدث'}</div>`;
      div.addEventListener('click', () => {
        resultsBox.style.display='none';
        searchBox.value = '';
        map.setView([m.lat, m.lng], 17);
        setTimeout(() => openSheet(m), 300);
      });
      resultsBox.appendChild(div);
    });
  }
  resultsBox.style.display = 'block';
});

/* ============ BOTTOM SHEET ============ */
const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');
let currentMeter = null;
let pendingPhotos = [];

function fmt(v){
  if(v === '' || v === null || v === undefined || v === 'nan') return '—';
  return v;
}

function openSheet(m){
  currentMeter = m;
  pendingPhotos = [];
  document.getElementById('photoPreviewWrap').innerHTML = '';
  document.getElementById('noteText').value = '';
  document.getElementById('saveMsg').textContent = '';

  document.getElementById('shName').textContent = m.name || 'بدون اسم';
  document.getElementById('shMeter').textContent = `رقم العداد: ${m.meter}`;
  const badge = document.getElementById('shStatus');
  badge.textContent = m.status === 'محدث' ? 'محدث' : 'غير محدث';
  badge.className = 'status-badge ' + (m.status === 'محدث' ? 'on' : 'off');

  document.getElementById('shAccount').textContent = fmt(m.account);
  document.getElementById('shBranch').textContent = fmt(m.branch);
  document.getElementById('shPlace').textContent = fmt(m.place);

  document.getElementById('gmapBtn').href = `https://www.google.com/maps/search/?api=1&query=${m.lat},${m.lng}`;

  renderNotesLog(m.meter);

function closeSheet(){
  overlay.style.display = 'none';
  sheet.classList.remove('open');
  currentMeter = null;

overlay.addEventListener('click', closeSheet);

function renderNotesLog(meterId){
  const list = getNotesFor(meterId);
  const wrap = document.getElementById('notesLogList');
  if(list.length === 0){
    wrap.innerHTML = '<div class="noEntries">لا توجد ملاحظات سابقة لهذا العداد</div>';
    return;
  }
  wrap.innerHTML = '';
  list.forEach(n => {
    const div = document.createElement('div');
    div.className = 'noteEntry';
    const imgsHtml = (n.photos && n.photos.length)
      ? `<div class="imgs">${n.photos.map(p => `<img src="${p}">`).join('')}</div>` : '';
    div.innerHTML = `<div class="meta"><b>${n.employee || 'غير محدد'}</b><span>${n.time}</span></div>
      <div class="txt">${escapeHtml(n.text)}</div>${imgsHtml}`;
    wrap.appendChild(div);
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

/* photo handling — resize + compress before storing so Firestore docs stay small and fast to sync */
function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('photoInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  for(const file of files){
    try{
      const compressed = await compressImage(file, 900, 0.6);
      pendingPhotos.push(compressed);
      renderPendingPhotos();
    }catch(err){
      console.error('photo compress failed', err);
    }
  }
  e.target.value = '';
});

function renderPendingPhotos(){
  const wrap = document.getElementById('photoPreviewWrap');
  wrap.innerHTML = '';
  pendingPhotos.forEach((src, idx) => {
    const box = document.createElement('div');
    box.className = 'photoDel';
    box.innerHTML = `<img src="${src}"><div class="x" data-idx="${idx}">✕</div>`;
    box.querySelector('.x').addEventListener('click', () => {
      pendingPhotos.splice(idx, 1);
      renderPendingPhotos();
    });
    wrap.appendChild(box);
  });
}

/* save note */
document.getElementById('saveBtn').addEventListener('click', async () => {
  if(!currentMeter) return;
  const text = document.getElementById('noteText').value.trim();
  const emp = empInput.value.trim();
  if(!emp){
    document.getElementById('saveMsg').style.color = 'var(--off-color)';
    document.getElementById('saveMsg').textContent = 'الرجاء إدخال اسم الموظف أولاً';
    return;
  }
  if(!text && pendingPhotos.length === 0){
    document.getElementById('saveMsg').style.color = 'var(--off-color)';
    document.getElementById('saveMsg').textContent = 'اكتب ملاحظة أو أرفق صورة';
    return;
  }
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'جارٍ الحفظ...';

  const now = new Date();
  const entry = {
    employee: emp,
    text: text,
    photos: pendingPhotos.slice(),
    time: now.toLocaleString('ar-SA', { dateStyle:'medium', timeStyle:'short' })
  };
  const synced = await addNoteFor(currentMeter.meter, entry);

  document.getElementById('noteText').value = '';
  pendingPhotos = [];
  renderPendingPhotos();
  renderNotesLog(currentMeter.meter);

  saveBtn.disabled = false;
  saveBtn.textContent = '💾 حفظ الملاحظة';

  if(synced){
    document.getElementById('saveMsg').style.color = 'var(--on-color)';
    document.getElementById('saveMsg').textContent = '✔ تم الحفظ، وتظهر الآن لجميع الموظفين';
  } else {
    document.getElementById('saveMsg').style.color = 'var(--off-color)';
    document.getElementById('saveMsg').textContent = '⚠ لا يوجد اتصال بالإنترنت — تم الحفظ على جهازك فقط مؤقتًا';
  }
});
