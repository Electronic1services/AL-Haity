<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>خريطة جميع عدادات فرع الحائط</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body,#app{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
body{background:#f4f6f5;color:#172522}
#app{display:flex;flex-direction:column}
.top{background:#0b3d3d;color:#fff;padding:10px;z-index:1000;box-shadow:0 3px 14px #0003}
.r{display:flex;gap:7px;align-items:center}
.title{font-weight:800;flex:1;font-size:14px}
.small{font-size:11px;opacity:.8}
input,select,textarea,button{font:inherit}
.top input{border:0;border-radius:9px;padding:9px;width:135px}
.search{margin-top:8px}
.search input{width:100%}
.stats{display:flex;gap:6px;margin-top:8px;overflow:auto}
.chip{border:1px solid #ffffff55;background:#155e5e;color:#fff;border-radius:18px;padding:6px 10px;white-space:nowrap;font-size:12px;display:flex;align-items:center;gap:5px}
.chip.active{outline:2px solid #fff}
.chip .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.main{position:relative;flex:1;min-height:0}
#map{height:100%;width:100%;background:#ddd}
.results{position:absolute;top:8px;right:8px;left:8px;z-index:900;background:#fff;border-radius:12px;max-height:45%;overflow:auto;display:none;box-shadow:0 6px 22px #0004}
.item{padding:9px;border-bottom:1px solid #eee}
.item b{color:#0b3d3d}
.item .tag{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:10px;color:#fff;margin-left:4px}
.sheet{position:fixed;z-index:2000;right:8px;left:8px;bottom:8px;background:#fff;border-radius:18px;padding:14px;box-shadow:0 0 30px #0005;max-height:82vh;overflow:auto;display:none}
.sheet.open{display:block}
.close{float:left;border:0;background:#eee;border-radius:50%;width:32px;height:32px}
.meta{font-size:12px;color:#667;line-height:1.9}
.field{margin-top:10px}
.field label{display:block;font-weight:700;font-size:12px;margin-bottom:4px}
.field select,.field textarea{width:100%;padding:10px;border:1px solid #ccd4d1;border-radius:10px;background:#fff}
.field textarea{min-height:65px}
.save{width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:#d97b1f;color:#fff;font-weight:800}
.reportBtn{display:block;width:100%;padding:9px;border-radius:10px;background:#fff;color:#0b3d3d;font-weight:800;text-align:center;text-decoration:none}
.nav{display:block;width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:#1976d2;color:#fff;font-weight:800;text-align:center;text-decoration:none}
.log{margin-top:12px}
.entry{background:#f5f6f4;border-right:4px solid #1d8a8a;border-radius:9px;padding:8px;margin-top:6px;font-size:12px}
.badge{display:inline-block;padding:3px 7px;border-radius:12px;color:#fff;font-weight:700}
.done{background:#1d8a4a}
.notdone{background:#c23b3b}
.typeBadge{display:inline-block;padding:4px 11px;border-radius:12px;color:#fff;font-weight:800;font-size:12px;margin-bottom:8px}
.statusPill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.statusPill.on{background:#1d8a4a;color:#fff}
.statusPill.off{background:#c23b3b;color:#fff}
.noCoord{position:absolute;bottom:10px;left:10px;z-index:700;background:#fff;padding:7px;border-radius:9px;font-size:11px;box-shadow:0 2px 10px #0002}
#locateBtn{position:absolute;bottom:16px;right:10px;z-index:900;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 10px #0004;border:none;display:flex;align-items:center;justify-content:center;font-size:20px}
#locateBtn.tracking{background:#1d6fd9;color:#fff}
.live-dot-wrap{position:relative;width:26px;height:26px}
.live-dot-pulse{position:absolute;top:50%;left:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(29,111,217,.35);animation:liveDotPulse 1.8s ease-out infinite}
@keyframes liveDotPulse{0%{transform:scale(0.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.live-dot-core{position:absolute;top:50%;left:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#1d6fd9;border:3px solid #fff;box-shadow:0 1px 5px #0007}
.empRow{display:flex;align-items:center;justify-content:space-between;background:#f5f6f4;border-radius:10px;padding:9px 12px;margin-bottom:8px}
.empRow .name{font-weight:800;color:#0b3d3d}
.empRow .when{font-size:11px;color:#778}
.empRow button{border:0;background:#1d6fd9;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700}
.emp-marker{position:relative;width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:#d97b1f;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 5px #0008}
.emp-marker span{transform:rotate(45deg);font-size:14px}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="r">
      <div class="title">📍 جميع عدادات فرع الحائط <span class="small" id="count"></span></div>
      <input id="emp" placeholder="اسم الموظف">
    </div>
    <div class="search"><input id="q" placeholder="ابحث برقم العداد / الحساب / اسم العميل / المنطقة"></div>
    <div style="margin-top:8px;display:flex;gap:8px">
      <button id="reportBtn" class="reportBtn" type="button" style="flex:1">📊 تحميل التقرير المحدث</button>
      <button id="empPanelBtn" class="reportBtn" type="button" style="flex:1">👥 مواقع الموظفين</button>
    </div>

    <div class="stats">
      <button class="chip active" data-f="all">الكل <span id="allC"></span></button>
      <button class="chip" data-f="ON"><span class="dot" style="background:#1d8a4a"></span>تعمل <span id="onC">0</span></button>
      <button class="chip" data-f="OFF"><span class="dot" style="background:#c23b3b"></span>متوقفة <span id="offC">0</span></button>
      <button class="chip" data-f="free"><span class="dot" style="background:#1976d2"></span>بدون عميل (حرة) <span id="freeC">0</span></button>
    </div>
  </div>

  <div class="main">
    <div id="map"></div>
    <div class="results" id="results"></div>
    <div class="noCoord" id="coordInfo"></div>
    <button id="locateBtn" title="تتبّع موقعي">🎯</button>
  </div>
</div>

<div class="sheet" id="empPanel">
  <button class="close" id="closeEmpPanel">×</button>
  <h3 style="margin:0 0 10px">👥 مواقع الموظفين الحالية</h3>
  <div id="empList" style="font-size:13px"></div>
</div>

<div class="sheet" id="sheet">
  <button class="close" id="close">×</button>
  <span class="typeBadge" id="typeBadge"></span>
  <h3 id="mTitle" style="margin:0 0 6px"></h3>
  <div class="meta" id="mMeta"></div>
  <a id="googleNav" class="nav" href="#" target="_blank" rel="noopener">📍 الانتقال إلى موقع العداد عبر Google Maps</a>

  <div class="field">
    <label>الملاحظة *</label>
    <select id="noteStatus">
      <option value="">اختر...</option>
      <option>تم تحديثه</option>
      <option>لم يتم تحديثه</option>
    </select>
  </div>
  <div class="field">
    <label>ملاحظات إضافية</label>
    <textarea id="noteText" placeholder="اكتب ملاحظة إضافية إن وجدت..."></textarea>
  </div>
  <button class="save" id="save">💾 حفظ</button>
  <div id="msg" style="text-align:center;margin-top:6px;font-size:12px"></div>

  <div class="log">
    <b>آخر تسجيل</b>
    <div id="last"></div>
  </div>
</div>

document.getElementById('allC').textContent = valid.length;
document.getElementById('coordInfo').textContent = 'العدادات المعتمدة على الخريطة: ' + valid.length;
document.getElementById('onC').textContent = valid.filter(m => m.meterStatus === 'ON').length;
document.getElementById('offC').textContent = valid.filter(m => m.meterStatus === 'OFF').length;
document.getElementById('freeC').textContent = valid.filter(m => m.type === 'free').length;

function icon(m, visited) {
  const fill = m.type === 'free' ? '#1976d2' : (m.meterStatus === 'ON' ? '#1d8a4a' : m.meterStatus === 'OFF' ? '#c23b3b' : '#9e9e9e');
  const check = visited ? '<span style="position:absolute;top:-6px;right:-6px;width:14px;height:14px;border-radius:50%;background:#fff;color:#0f7a43;border:2px solid #0f7a43;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;line-height:1;">✓</span>' : '';
  return L.divIcon({
    className: '',
    html: '<div style="position:relative;width:18px;height:18px;"><div style="width:18px;height:18px;border-radius:50%;background:' + fill + ';border:2.5px solid #fff;box-shadow:0 1px 4px #0008"></div>' + check + '</div>',
    iconSize: [18, 18], iconAnchor: [9, 9]
  });
}

valid.forEach(m => {
  const mk = L.marker([m.lat, m.lng], { icon: icon(m, false) }).addTo(map).on('click', () => openMeter(m));
  markers[meterKey(m)] = mk;
});

async function loadLatest() {
  latest = {};
  if (db) {
    try {
      const s = await db.collection('all_meters_notes').get();
      s.forEach(d => { latest[d.id] = d.data(); });
    } catch (e) { console.warn(e); }
  } else {
    latest = JSON.parse(localStorage.getItem('all_meters_notes_latest') || '{}');
  }
  refreshMarkers();
  applyFilter();
}

function refreshMarkers() {
  valid.forEach(m => {
    const k = meterKey(m);
    if (markers[k]) markers[k].setIcon(icon(m, !!latest[k]));
  });
}

function applyFilter() {
  valid.forEach(m => {
    const show = statusFilter === 'all' || (statusFilter === 'free' ? m.type === 'free' : m.meterStatus === statusFilter);
    const mk = markers[meterKey(m)];
    if (show && !map.hasLayer(mk)) mk.addTo(map);
    if (!show && map.hasLayer(mk)) map.removeLayer(mk);
  });
}

document.querySelectorAll('.chip[data-f]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.chip[data-f]').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  statusFilter = b.dataset.f;
  applyFilter();
});

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function statusPill(s) {
  const on = s === 'Active';
  return '<span class="statusPill ' + (on ? 'on' : 'off') + '">' + esc(s) + '</span>';
}

function openMeter(m) {
  current = m;
  const isFree = m.type === 'free';
  document.getElementById('typeBadge').textContent = isFree ? '🔵 عداد بدون عميل مرتبط (ساعة حرة)' : (m.meterStatus === 'ON' ? '🟢 عداد يعمل (ON)' : m.meterStatus === 'OFF' ? '🔴 عداد متوقف (OFF)' : '⚪ حالة غير محددة');
  document.getElementById('typeBadge').style.background = isFree ? '#1976d2' : (m.meterStatus === 'ON' ? '#1d8a4a' : m.meterStatus === 'OFF' ? '#c23b3b' : '#9e9e9e');
  document.getElementById('mTitle').textContent = isFree ? ('عداد ' + m.meter) : esc(m.name || 'بدون اسم');
  const coord = m.lat && m.lng ? (m.lat.toFixed(7) + ', ' + m.lng.toFixed(7)) : 'لا توجد إحداثيات صالحة';

  let metaHtml = '';
  if (isFree) {
    metaHtml += '<b>المنطقة:</b> ' + esc(m.area || '—') + '<br>';
    metaHtml += '<b>رقم العداد:</b> ' + esc(m.meter || '—') + '<br>';
  } else {
    metaHtml += '<b>رقم الحساب:</b> ' + esc(m.account) + '<br>';
    metaHtml += '<b>الفرع:</b> ' + esc(m.branch) + ' — <b>الحي:</b> ' + esc(m.district) + '<br>';
    metaHtml += '<b>فئة العميل:</b> ' + esc(m.class) + '<br>';
    metaHtml += '<b>المنطقة:</b> ' + esc(m.area || '—') + '<br>';
    metaHtml += '<b>رقم العداد:</b> ' + esc(m.meter || '—') + '<br>';
    metaHtml += '<b>حالة اشتراك الماء:</b> ' + statusPill(m.waterStatus) + '<br>';
    metaHtml += '<b>حالة اشتراك الصرف:</b> ' + statusPill(m.sewerStatus) + '<br>';
  }
  metaHtml += '<b>الإحداثيات:</b> ' + esc(coord);
  document.getElementById('mMeta').innerHTML = metaHtml;

  const nav = document.getElementById('googleNav');
  if (m.lat && m.lng) {
    nav.href = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(m.lat + ',' + m.lng);
    nav.style.display = 'block';
  } else {
    nav.removeAttribute('href');
    nav.style.display = 'none';
  }

  const key = meterKey(m);
  const x = latest[key];
  document.getElementById('noteStatus').value = x?.noteStatus || '';
  document.getElementById('noteText').value = '';
  document.getElementById('last').innerHTML = x
    ? '<div class="entry"><span class="badge ' + (x.noteStatus === 'تم تحديثه' ? 'done' : 'notdone') + '">' + esc(x.noteStatus) + '</span><br>' + esc(x.text || '') + '<br><small>' + esc(x.employee || '') + ' - ' + esc(x.createdAt || '') + '</small></div>'
    : '<div class="entry">لا يوجد تسجيل سابق</div>';
  document.getElementById('sheet').classList.add('open');
}

document.getElementById('close').onclick = () => document.getElementById('sheet').classList.remove('open');

document.getElementById('reportBtn').onclick = async () => {
  const btn = document.getElementById('reportBtn');
  const old = btn.textContent; btn.disabled = true; btn.textContent = '⏳ جاري تجهيز التقرير...';
  try {
    await loadLatest();
    const rows = valid.map(m => {
      const r = latest[meterKey(m)] || {};
      return {
        'النوع': m.type === 'free' ? 'ساعة حرة' : 'عميل',
        'ACCOUNT ID': m.account || '',
        'CUSTOMER NAME': m.name || '',
        'BRANCH NAME': m.branch || '',
        'DISTRICT NAME': m.district || '',
        'CUSTOMER CLASS': m.class || '',
        'المنطقة': m.area || '',
        'METER ID': m.meter || '',
        'METER STATUS': m.meterStatus || '',
        'WATER SA STATUS': m.waterStatus || '',
        'SEWER SA STATUS': m.sewerStatus || '',
        'LATITUDE': m.lat || '',
        'LONGITUDE': m.lng || '',
        'حالة المتابعة': r.noteStatus || '',
        'ملاحظات الموظف': r.text || '',
        'اسم الموظف': r.employee || '',
        'تاريخ ووقت التسجيل': r.createdAt || ''
      };
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{ wch: 12 }, { wch: 14 }, { wch: 30 }, { wch: 14 }, { wch: 16 }, { wch: 12 }, { wch: 18 }, { wch: 14 }, { wch: 12 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 16 }, { wch: 35 }, { wch: 18 }, { wch: 22 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'جميع العدادات');
    const now = new Date();
    const stamp = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    XLSX.writeFile(wb, 'All_Meters_Report_' + valid.length + '_' + stamp + '.xlsx');
  } catch (e) { alert('تعذر إنشاء التقرير: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = old; }
};

document.getElementById('save').onclick = async () => {
  if (!current) return;
  const employee = document.getElementById('emp').value.trim();
  const noteStatus = document.getElementById('noteStatus').value;
  const text = document.getElementById('noteText').value.trim();
  if (!employee) { alert('اكتب اسم الموظف أولاً'); return; }
  if (!noteStatus) { alert('اختر تم تحديثه أو لم يتم تحديثه'); return; }
  const key = meterKey(current);
  const now = Date.now();
  const rec = {
    type: current.type, meter: current.meter, account: current.account, name: current.name,
    branch: current.branch, area: current.area, lat: current.lat, lng: current.lng,
    noteStatus, text, employee,
    createdAt: new Date(now).toLocaleString('ar-SA'), createdAtMs: now, updatedAtMs: now
  };
  try {
    if (db) await db.collection('all_meters_notes').doc(key).set(rec, { merge: true });
    latest[key] = rec;
    if (!db) localStorage.setItem('all_meters_notes_latest', JSON.stringify(latest));
    document.getElementById('msg').textContent = 'تم الحفظ ✓';
    openMeter(current);
    refreshMarkers();
  } catch (e) { alert('تعذر الحفظ: ' + e.message); }
};

const q = document.getElementById('q'), res = document.getElementById('results');
q.oninput = () => {
  const v = q.value.trim();
  if (!v) { res.style.display = 'none'; return; }
  const a = valid.filter(m => (m.meter + ' ' + m.account + ' ' + m.name + ' ' + m.branch + ' ' + m.area).includes(v)).slice(0, 50);
  res.innerHTML = a.map((m) => {
    const tag = m.type === 'free' ? '<span class="tag" style="background:#1976d2">حرة</span>' : ('<span class="tag" style="background:' + (m.meterStatus === 'ON' ? '#1d8a4a' : '#c23b3b') + '">' + (m.meterStatus || '—') + '</span>');
    const sub = m.type === 'free' ? (m.area || '') : (m.branch + ' — حساب ' + m.account);
    return '<div class="item" data-i="' + valid.indexOf(m) + '"><b>' + esc(m.meter) + '</b>' + tag + '<br><small>' + esc(sub) + '</small></div>';
  }).join('') || '<div class="item">لا توجد نتائج</div>';
  res.style.display = 'block';
  res.querySelectorAll('[data-i]').forEach(x => x.onclick = () => {
    const m = valid[+x.dataset.i];
    res.style.display = 'none';
    q.value = '';
    if (m.lat && m.lng) map.setView([m.lat, m.lng], 18);
    openMeter(m);
  });
};

loadLatest();

/* ============ LIVE LOCATION TRACKING (continuous "you are here" dot) ============ */
let watchId = null;
let liveMarker = null;
let followMe = true;

function liveIcon(){
  return L.divIcon({
    className:'',
    html:'<div class="live-dot-wrap"><div class="live-dot-pulse"></div><div class="live-dot-core"></div></div>',
    iconSize:[26,26], iconAnchor:[13,13]
  });
}

function onPosition(pos){
  const latlng = [pos.coords.latitude, pos.coords.longitude];
  if(!liveMarker){
    liveMarker = L.marker(latlng, { icon: liveIcon(), zIndexOffset: 1000 }).addTo(map);
  } else {
    liveMarker.setLatLng(latlng);
  }
  if(followMe) map.setView(latlng, Math.max(map.getZoom(), 16));
}

function onPositionError(err){
  alert('تعذر تحديد موقعك، تأكد من تفعيل خدمة الموقع. (' + (err.message || '') + ')');
  stopTracking();
}

function startTracking(){
  if(!navigator.geolocation){ alert('المتصفح لا يدعم تحديد الموقع'); return; }
  followMe = true;
  watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
    enableHighAccuracy:true, maximumAge:2000, timeout:15000
  });
  document.getElementById('locateBtn').classList.add('tracking');
}

function stopTracking(){
  if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  document.getElementById('locateBtn').classList.remove('tracking');
}

document.getElementById('locateBtn').addEventListener('click', () => {
  if(watchId === null) startTracking(); else stopTracking();
});

map.on('dragstart', () => { if(watchId !== null) followMe = false; });

/* ============ EMPLOYEE NAME PERSISTENCE (remembers this device) ============ */
const EMP_KEY = 'field_emp_name';
const DEVICE_KEY = 'field_device_id';
const empInput = document.getElementById('emp');
empInput.value = localStorage.getItem(EMP_KEY) || '';
empInput.addEventListener('input', () => {
  localStorage.setItem(EMP_KEY, empInput.value.trim());
  maybeStartReporting();
});

function getDeviceId(){
  let id = localStorage.getItem(DEVICE_KEY);
  if (!id) {
    id = 'dev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem(DEVICE_KEY, id);
  }
  return id;
}

/* ============ SILENT BACKGROUND LOCATION REPORTING FOR STAFF TRACKING ============
   As soon as the employee has typed their name, their position is reported to
   Firestore periodically (throttled) so a supervisor can see everyone's current
   location and daily movement path from the "مواقع الموظفين" panel — independent
   from the personal 🎯 tracking button above, which only affects the map view. */
let reportWatchId = null;
let lastReportTime = 0;
let lastReportLatLng = null;
const REPORT_MIN_INTERVAL_MS = 20000;
const REPORT_MIN_DISTANCE_M = 30;

function empDocId(name){
  return name.trim().replace(/[\/\.#\$\[\]]/g, '_').slice(0, 120);
}

function reportPosition(pos){
  if (!db) return;
  const name = empInput.value.trim();
  if (!name) return;
  const latlng = [pos.coords.latitude, pos.coords.longitude];
  const now = Date.now();
  const moved = !lastReportLatLng || map.distance(lastReportLatLng, latlng) > REPORT_MIN_DISTANCE_M;
  const timeOk = now - lastReportTime > REPORT_MIN_INTERVAL_MS;
  if (!(moved && timeOk) && lastReportLatLng) return;
  lastReportTime = now;
  lastReportLatLng = latlng;
  const id = empDocId(name);
  db.collection('employee_status').doc(id).set({
    employee: name, lat: latlng[0], lng: latlng[1],
    lastSeen: now, lastSeenText: new Date(now).toLocaleString('ar-SA'),
    deviceId: getDeviceId()
  }, { merge: true }).catch(() => {});
}

function maybeStartReporting(){
  if (reportWatchId !== null) return; // already running
  if (!empInput.value.trim()) return;
  if (!navigator.geolocation) return;
  reportWatchId = navigator.geolocation.watchPosition(reportPosition, () => {}, {
    enableHighAccuracy: true, maximumAge: 10000, timeout: 20000
  });
}
maybeStartReporting();

/* ============ "EMPLOYEES ON MAP" PANEL (supervisor view) ============ */
let empMarkers = {};

function timeAgo(ms){
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 60) return 'قبل ' + s + ' ثانية';
  const m = Math.round(s / 60);
  if (m < 60) return 'قبل ' + m + ' دقيقة';
  const h = Math.round(m / 60);
  return 'قبل ' + h + ' ساعة';
}

async function loadEmployees(){
  const wrap = document.getElementById('empList');
  wrap.innerHTML = '<div style="text-align:center;color:#889;padding:20px">⏳ جاري التحميل...</div>';
  Object.values(empMarkers).forEach(mk => map.removeLayer(mk));
  empMarkers = {};
  if (!db) { wrap.innerHTML = '<div style="text-align:center;color:#889">لا يوجد اتصال بقاعدة البيانات</div>'; return; }
  try {
    const snap = await db.collection('employee_status').get();
    if (snap.empty) { wrap.innerHTML = '<div style="text-align:center;color:#889;padding:20px">لا يوجد موظفون مسجَّلون بعد</div>'; return; }
    let html = '';
    snap.forEach(doc => {
      const d = doc.data();
      const online = (Date.now() - (d.lastSeen || 0)) < 5 * 60000;
      html += '<div class="empRow"><div><div class="name">' + (online ? '🟢' : '⚪') + ' ' + esc(d.employee || doc.id) + '</div><div class="when">' + esc(d.lastSeenText || '') + ' (' + timeAgo(d.lastSeen || 0) + ')</div></div></div>';
      if (d.lat && d.lng) {
        const mk = L.marker([d.lat, d.lng], {
          icon: L.divIcon({ className: '', html: '<div class="emp-marker"><span>👤</span></div>', iconSize: [30, 30], iconAnchor: [15, 30] })
        }).addTo(map).bindTooltip(d.employee || doc.id, { permanent: false });
        mk.on('click', () => map.setView([d.lat, d.lng], 17));
        empMarkers[doc.id] = mk;
      }
    });
    wrap.innerHTML = html;
  } catch (e) {
    wrap.innerHTML = '<div style="text-align:center;color:#c23b3b">تعذر التحميل: ' + esc(e.message) + '</div>';
  }
}

document.getElementById('empPanelBtn').onclick = () => {
  document.getElementById('empPanel').classList.add('open');
  loadEmployees();
};
document.getElementById('closeEmpPanel').onclick = () => document.getElementById('empPanel').classList.remove('open');
</script>
